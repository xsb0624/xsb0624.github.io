baseURL = "https://yizhixiong.com/"
locale = "zh-cn"
title = "我的博客"
theme = "PaperMod"
paginate = 10

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false

# 将 Obsidian 粘贴的图片目录 images/ 挂载为静态资源
# (图片保存在 images/xxx.png, 线上通过 /images/xxx.png 访问)
[module]
  [[module.mounts]]
    source = "images"
    target = "static/images"


[params]
  env = "production"
  title = "我的博客"
  description = "记录思考、分享生活与技术"
  keywords = ["博客", "Blog", "随笔"]
  author = "xsb0624"
  DateFormat = "2006-01-02"
  defaultTheme = "auto" # auto / light / dark
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  comments = false

  [params.assets]
    favicon = "/favicon.ico"

  [params.homeInfoParams]
    Title = "你好，欢迎来到我的博客 👋"
    Content = "这里是我记录思考、分享生活与技术的地方。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/xsb0624"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:xsb0624@qq.com"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    ignoreLocation = true
    keys = ["title", "permalink", "summary", "content"]

[languages]
  [languages.zh-cn]
    label = "简体中文"
    weight = 1
    title = "我的博客"
    [languages.zh-cn.params]
      subtitle = "记录思考，分享生活"
    [languages.zh-cn.menu]
      [[languages.zh-cn.menu.main]]
        name = "首页"
        url = "/"
        weight = 1
      [[languages.zh-cn.menu.main]]
        name = "归档"
        url = "/archives/"
        weight = 2
      [[languages.zh-cn.menu.main]]
        name = "标签"
        url = "/tags/"
        weight = 3
      [[languages.zh-cn.menu.main]]
        name = "搜索"
        url = "/search/"
        weight = 4
      [[languages.zh-cn.menu.main]]
        name = "关于"
        url = "/about/"
        weight = 5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
